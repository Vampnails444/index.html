<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampnails444 Payment</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            /* ปรับพื้นหลังเป็นโทนชมพูอ่อนตามภาพตัวอย่าง */
            background-color: #fce4ec;
            background-image: radial-gradient(#f8bbd0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }
       
        @keyframes float-up-down {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }
        @keyframes float-left-right {
            0%, 100% { transform: translateX(0px) rotate(0deg); }
            50% { transform: translateX(15px) rotate(-10deg); }
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        
        @keyframes dash-animation {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -24; }
        }
        .animate-dash {
            animation: dash-animation 1s linear infinite;
        }
        .anim-float-1 { animation: float-up-down 4s ease-in-out infinite; }
        .anim-float-2 { animation: float-up-down 5s ease-in-out infinite 1.5s; }
        .anim-float-3 { animation: float-left-right 6s ease-in-out infinite; }
        .anim-float-4 { animation: float-left-right 4.5s ease-in-out infinite 2s; }
        .anim-pulse { animation: pulse-soft 3s ease-in-out infinite; }
        .anim-spin { animation: spin-slow 8s linear infinite; }

        /* ปรับ Glass Card ให้เป็นโทนสีขาวขุ่น-ชมพู */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 182, 193, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .virtual-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .virtual-card:hover {
            transform: translateY(-4px);
        }
       
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
   
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vamp: {
                            black: '#2d2d2d', /* เปลี่ยนจากดำสนิทเป็นเทาดำเข้ม */
                            brown: '#f06292', /* ชมพูเข้มแบบละมุน */
                            pink: '#ff80ab', /* ชมพูสดใส */
                            light: '#4a4a4a', /* สีเทาสำหรับตัวหนังสือ */
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col items-center py-6 px-4 text-vamp-black relative overflow-x-hidden">
    <!-- คงโครงสร้างพื้นฐานเดิมไว้ทั้งหมดตามเงื่อนไข -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-vamp-black text-white px-6 py-3 rounded-full shadow-xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 flex items-center gap-2 font-bold text-sm border border-white/20">
        คัดลอกเลขบัญชีแล้ว
    </div>

    <div class="max-w-[420px] w-full relative z-10 space-y-5 pb-10">
       
        <div class="text-center pt-2 pb-2 relative">
            <img src="ไม่มีชื่อ 893_20260604101231.png" alt="Vampnails444" class="w-20 h-20 mx-auto mb-3 rounded-full border-4 border-white shadow-lg object-cover anim-pulse">
            
            <h1 class="text-2xl font-bold tracking-tight text-vamp-black flex items-center justify-center gap-2">
                Vampnails444
            </h1>
            <p class="text-sm font-medium text-vamp-light mt-1 uppercase tracking-widest">Payment & Checkout</p>
        </div>

        <div class="glass-card rounded-[40px] p-3 relative z-10">
            <div class="relative p-2 rounded-[36px] z-10 mt-4">
                <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="calc(100% - 4px)" height="calc(100% - 4px)" rx="34" fill="none" stroke="#f06292" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round" class="animate-dash" />
                </svg>
                
                <div class="rounded-[28px] overflow-hidden relative shadow-sm border-[4px] border-white z-20">
                    <img src="BDE36C1C-C4F0-40DE-9147-9432185E70B0.png" alt="Vampnails444 Payment" class="w-full h-auto object-cover">
                </div>

                <a href="BDE36C1C-C4F0-40DE-9147-9432185E70B0.png" download="Vampnails444_QR.png" class="mt-4 flex items-center justify-center gap-2 w-full bg-vamp-black text-white text-sm font-bold py-3 rounded-full shadow-md transition-all z-30 relative cursor-pointer">
                    บันทึกภาพ
                </a>
            </div>

            <div class="p-4 pt-6 space-y-5">
                <div class="text-center space-y-3">
                    <p class="text-[15px] font-medium leading-relaxed text-vamp-black">
                        ชื่อบัญชี <span class="text-white font-bold bg-vamp-brown px-3 py-1 rounded-xl">ภัทรนันท์ บุญรักกว้าง</span>
                    </p>
                </div>

                <div class="space-y-4">
                    <!-- ปุ่ม KBank -->
                    <div class="virtual-card relative bg-[#f8f9fa] rounded-[24px] p-5 shadow-sm border border-gray-200 cursor-pointer" onclick="copyText('2343871360', this, 'kbank')">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-vamp-black font-bold text-sm">KBank</span>
                            <button class="kbank-btn bg-white border border-gray-300 text-vamp-black text-[12px] font-bold px-4 py-1.5 rounded-full">คัดลอก</button>
                        </div>
                        <div class="text-vamp-brown font-bold text-[20px] tracking-widest">234-387-1360</div>
                    </div>

                    <!-- ปุ่ม TrueMoney -->
                    <div class="virtual-card relative bg-[#f8f9fa] rounded-[24px] p-5 shadow-sm border border-gray-200 cursor-pointer" onclick="copyText('0996325583', this, 'true')">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-vamp-black font-bold text-sm">TrueMoney</span>
                            <button class="true-btn bg-white border border-gray-300 text-vamp-black text-[12px] font-bold px-4 py-1.5 rounded-full">คัดลอก</button>
                        </div>
                        <div class="text-vamp-brown font-bold text-[20px] tracking-widest">099-632-5583</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script คงไว้ตามเดิม -->
    <script>
        function copyText(text, containerElement, type) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast();
        }
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }
    </script>
</body>
</html>
